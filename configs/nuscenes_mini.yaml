# nuScenes v1.0-mini, pedestrians + cyclists as prediction targets.
# Keyframes are 2 Hz (0.5 s): 5 observed steps (2 s incl. current frame)
# -> 12 predicted steps (6 s), the nuScenes prediction-challenge horizon.
# Scene split: train = 7 mini_train scenes, val = scene-1100 (held out from
# mini_train), test = the 2 official mini_val scenes (never used for selection).
# v1.0-mini is for pipeline validation: 2 test scenes are not a benchmark.
dataset:
  type: nuscenes
  data_root: ./
  version: v1.0-mini
  dt: 0.5
  past_steps: 5
  future_steps: 12
  num_agents_max: 32
  min_past_obs: 2
  target_categories: [human.pedestrian, vehicle.bicycle]
  num_polylines: 0               # > 0 needs nuscenes-devkit + map expansion
  polyline_points: 20

model:
  type: trajectory
  model_dim: 128
  num_heads: 4
  num_transformer_layers: 2
  latent_dim: 32
  num_goals: 6
  num_candidates: 20             # >= 20 so best-of-20 can be reported
  num_predictions: 6
  state_dim: 4
  goal_embed_dim: 64
  decoder_hidden_dim: 128
  gat_heads: 4
  gat_layers: 2
  edge_dim: 3
  temporal_encoder: transformer
  use_social: true
  use_map: true
  use_cvae: true
  use_goals: true
  use_ranking: true
  lstm_hidden: 128
  lstm_modes: 20

baseline:
  heading_noise_deg: 25.0

training:
  seed: 0
  epochs: 60
  warmup_epochs: 2
  batch_size: 8
  learning_rate: 1.0e-3
  weight_decay: 0.0
  grad_clip: 1.0
  num_workers: 0
  max_agents_per_batch: 256       # batches group scenes of similar size
  teacher_forcing_ratio: 0.5
  teacher_forcing_min: 0.0
  teacher_forcing_decay_epochs: 30
  kl_anneal_epochs: 10
  early_stopping_patience: 12
  max_batches_per_epoch: null
  checkpoint_path: runs/nuscenes_mini/ours/seed0/best.pt
  diversity_clamp: 3.0
  rank_temperature: 0.2          # soft ranking targets softmax(-ADE / T), metres
  loss_weights:
    min_ade: 1.0
    min_fde: 1.0
    recon: 1.0
    goal: 0.5
    kl: 0.1
    diversity: 0.0
    rank: 1.0
    nll: 0.0

evaluation:
  ks: [1, 6, 20]
  miss_threshold: 2.0
  seed: 0
  timing_scenes: 40

logging:
  use_wandb: false
  project_name: trajectory
  log_every: 1
